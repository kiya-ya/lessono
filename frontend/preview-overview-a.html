<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预览A · Bento 驾驶舱</title>
<script src="js/echarts.min.js"></script>
<style>
:root { --bg:#F2F3F7; --card:#fff; --tx:#1A1D26; --t2:#5C5C66; --t3:#9CA3AF; --ac:#7C5CFF; --up:#16A34A; --down:#DC2626; --warn:#D97706; --line:#ECEEF2; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--tx); padding:20px 26px; }
a { text-decoration:none; }
.top { display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
.top h1 { font-size:18px; font-weight:700; }
.top .sub { font-size:12px; color:var(--t3); }
.top .nav { margin-left:auto; font-size:12px; color:var(--ac); }

/* KPI 横条 */
.kpi-strip { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:14px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; position:relative; overflow:hidden; }
.kpi::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--ac); }
.kpi.up::before { background:var(--up); } .kpi.down::before { background:var(--down); } .kpi.warn::before { background:var(--warn); }
.kpi .l { font-size:11px; color:var(--t3); }
.kpi .v { font-size:22px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }
.kpi .d { font-size:10.5px; margin-top:2px; }
.kpi .d.up { color:var(--up); } .kpi .d.down { color:var(--down); }

/* Bento 网格 */
.bento { display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:minmax(150px,auto); gap:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; cursor:pointer; transition:box-shadow .15s,border-color .15s; }
.card:hover { box-shadow:0 6px 20px rgba(26,29,38,.08); border-color:#D9D5F0; }
.card .h { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.card .h b { font-size:13.5px; }
.card .h .go { font-size:11px; color:var(--ac); font-weight:600; }
.card .body { flex:1; font-size:12.5px; color:var(--t2); line-height:1.8; }
.s2 { grid-column:span 2; }
.big-num { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; }
.mut { color:var(--t3); font-size:11px; }
.pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:10.5px; font-weight:600; }
.pill.red { background:#FDECEC; color:var(--down); } .pill.amber { background:#FFFBEB; color:var(--warn); } .pill.violet { background:#F3F0FF; color:#5B3EC4; } .pill.green { background:#E8F6EE; color:var(--up); }
.rank-row { display:flex; align-items:center; gap:8px; padding:4px 0; }
.rank-no { width:18px; height:18px; border-radius:6px; background:#F3F4F6; color:var(--t2); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.rank-no.top { background:var(--ac); color:#fff; }
.chart-mini { flex:1; min-height:80px; }
.tag { font-size:10.5px; color:var(--t3); }
@media (max-width:900px){ .kpi-strip{grid-template-columns:repeat(3,1fr);} .bento{grid-template-columns:1fr 1fr;} }
@media (max-width:560px){ .kpi-strip{grid-template-columns:repeat(2,1fr);} .bento{grid-template-columns:1fr;} .s2{grid-column:span 1;} }
</style>
</head>
<body>
<div class="top">
  <h1>姐妹团驾驶舱 <span class="tag">预览 A · Bento 网格</span></h1>
  <span class="sub" id="ref-date">—</span>
  <a class="nav" href="/">← 返回正式版</a>
</div>

<div class="kpi-strip" id="kpi-strip"></div>

<div class="bento">
  <div class="card s2" onclick="location.href='/#alerts'">
    <div class="h"><b>预警中心</b><span class="go">进入 →</span></div>
    <div class="body" id="warn-body">加载中…</div>
  </div>
  <div class="card" onclick="location.href='/#captains'">
    <div class="h"><b>毕业妹妹留存</b><span class="go">进入 →</span></div>
    <div class="body" id="grad-body">加载中…</div>
  </div>
  <div class="card" onclick="location.href='/#detail'">
    <div class="h"><b>明细数据</b><span class="go">进入 →</span></div>
    <div class="body" id="detail-body">加载中…</div>
  </div>
  <div class="card s2" onclick="location.href='/#alerts'">
    <div class="h"><b>团分析 · 解散原因</b><span class="go">进入 →</span></div>
    <div class="chart-mini" id="dr-chart"></div>
  </div>
  <div class="card" onclick="location.href='/#compare'">
    <div class="h"><b>厅排行</b><span class="go">进入 →</span></div>
    <div class="body" id="hall-body">加载中…</div>
  </div>
  <div class="card" onclick="location.href='/#captains'">
    <div class="h"><b>师门产量榜</b><span class="go">进入 →</span></div>
    <div class="body" id="lineage-body">加载中…</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const money = v => v >= 10000 ? (v/10000).toFixed(1) + 'w' : Math.round(v);
const pctDelta = (v, suf='%') => (v == null ? '' : `<span class="d ${v>=0?'up':'down'}">${v>=0?'↑':'↓'}${Math.abs(v)}${suf}</span>`);

async function main() {
  // KPI
  const k = await (await fetch('/api/kpi?hall=all')).json();
  const kd = k.data;
  $('ref-date').textContent = `数据周期 ${k.week || ''} · 对比上一${k.period_type==='month'?'月':'周'}`;
  const kpis = [
    { l:'妹妹留存率', v: Math.round(kd.sister_retention.value)+'%', c:'up', note:'第1周仍在排档' },
    { l:'姐妹团留存率', v: Math.round(kd.retention.value)+'%', c:'warn', d: pctDelta(kd.retention.change,'pp') },
    { l:'解散率', v: kd.dissolution.value.toFixed(1)+'%', c:'down', d: pctDelta(-kd.dissolution.change,'pp') },
    { l:'新成团数', v: kd.new_team.value, c:'', d: pctDelta(kd.new_team.change) },
    { l:'进行中姐妹团', v: kd.active_team.value, c:'', d: pctDelta(kd.active_team.change) },
    { l:'毕业妹妹数', v: kd.graduated_sisters.value, c:'', d: pctDelta(kd.graduated_sisters.change) },
  ];
  $('kpi-strip').innerHTML = kpis.map(x => `<div class="kpi ${x.c}"><div class="l">${x.l}</div><div class="v">${x.v}</div>${x.d||`<div class="d" style="color:var(--t3)">${x.note||'&nbsp;'}</div>`}</div>`).join('');

  // 预警
  const w = await (await fetch('/api/warncenter')).json();
  $('warn-body').innerHTML = w.cards.map(c => {
    const lv = c.triggered ? 'red' : (c.level==='warning'?'amber':c.level==='severe'?'red':'violet');
    const lvTxt = c.triggered ? '触发' : '正常';
    const cur = c.current == null ? (c.total!=null?c.total+' 个':'—') : c.current + (c.key==='new_team'?' 个':'%');
    return `<div class="rank-row"><span class="pill ${lv}">${lvTxt}</span><span style="flex:1;">${c.title}</span><b>${cur}</b></div>`;
  }).join('');

  // 毕业妹妹
  const g = (await (await fetch('/api/grad-retention')).json()).stats;
  $('grad-body').innerHTML = `
    <div class="big-num" style="color:${g.w1s_rate<60?'var(--down)':'var(--up)'}">${g.w1s_rate ?? '—'}%</div>
    <div class="mut">第1周仍在排档 ${g.w1_scheduled}/${g.w1s_covered} 位</div>
    <div style="margin-top:8px;">产出达标 <b>${g.w1_rate ?? '—'}%</b> · 晋升姐姐 <b>${g.promoted}</b> 人</div>`;

  // 明细计数
  const [dt1, dt2] = await Promise.all([
    fetch('/api/detail-table?per_page=1').then(r=>r.json()),
    fetch('/api/detail-table?per_page=1&status=active').then(r=>r.json()),
  ]);
  $('detail-body').innerHTML = `
    <div class="big-num">${dt1.total}</div>
    <div class="mut">总姐妹团（去重）</div>
    <div style="margin-top:8px;">进行中 <b style="color:var(--up)">${dt2.total}</b> · 已结束 <b>${dt1.total - dt2.total}</b></div>`;

  // 解散原因 mini 图
  const dr = await (await fetch('/api/dissolve-reasons')).json();
  const chart = echarts.init($('dr-chart'));
  chart.setOption({
    tooltip:{trigger:'item',formatter:p=>`${p.name}<br/>${p.value} 个（${p.percent}%）`},
    series:[{type:'pie',radius:['45%','72%'],center:['50%','50%'],
      label:{fontSize:10,color:'#6B7280'},
      itemStyle:{borderRadius:4,borderColor:'#fff',borderWidth:2},
      data: dr.buckets.map((b,i)=>({name:b.name,value:b.count,itemStyle:{color:['#D56060','#C98A2D','#16A34A','#C0C4CC'][i%4]}}))}]
  });

  // 厅排行 TOP3
  const ho = await (await fetch('/api/hall-overview?weeks=2')).json();
  const halls = ho.data.filter(h=>h.sister_weekly_revenue!=null).sort((a,b)=>b.sister_weekly_revenue-a.sister_weekly_revenue).slice(0,3);
  $('hall-body').innerHTML = halls.map((h,i)=>`<div class="rank-row"><span class="rank-no top">${i+1}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${h.hall_name}</span><b>${money(h.sister_weekly_revenue)}</b></div>`).join('') || '本周暂无流水数据';

  // 师门榜 TOP3
  const lr = await (await fetch('/api/lineage-rank?limit=3')).json();
  $('lineage-body').innerHTML = (lr.data||[]).map((c,i)=>`<div class="rank-row"><span class="rank-no top">${i+1}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${c.nickname}</span><span>毕业 <b>${c.grad_count}</b> · 晋升 <b style="color:var(--ac)">${c.promoted_count}</b></span></div>`).join('') || '暂无数据';
}
main().catch(e => { document.body.insertAdjacentHTML('afterbegin', `<div style="background:#FDECEC;color:#DC2626;padding:8px 14px;border-radius:8px;margin-bottom:10px;font-size:12px;">加载失败（请先登录正式版页面）：${e.message}</div>`); });
</script>
</body>
</html>
