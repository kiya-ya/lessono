<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0E1016">
<title>登录 - 姐妹团数据看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background: #0E1016;
    -webkit-font-smoothing: antialiased;
  }

  /* 背景：深墨底 + 两束克制的光晕（无粒子，纯 CSS） */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(640px 480px at 18% 12%, rgba(79, 91, 213, 0.16), transparent 65%),
      radial-gradient(520px 420px at 85% 88%, rgba(61, 154, 108, 0.08), transparent 65%),
      #0E1016;
  }
  /* 细网格纹理，增加层次而不喧宾夺主 */
  .bg::after {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, black 30%, transparent 75%);
  }
  /* 可交互粒子层（TRAE 风格：粒子连线 + 鼠标牵引） */
  #bg-canvas { position: fixed; inset: 0; z-index: 0; }

  .login-wrap {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; height: 100dvh; padding: 20px;
  }

  /* 品牌区 */
  .brand { text-align: center; margin-bottom: 30px; animation: fadeDown .6s cubic-bezier(.16,1,.3,1) both; }
  .brand .logo {
    width: 52px; height: 52px; margin: 0 auto 16px;
    border-radius: 13px; overflow: hidden;
    box-shadow: 0 8px 28px rgba(79, 91, 213, 0.4);
  }
  .brand .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .brand h1 {
    color: rgba(255,255,255,0.94); font-size: 24px; font-weight: 600;
    letter-spacing: .06em;
  }
  .brand .en {
    color: rgba(255,255,255,0.32); font-size: 11px; letter-spacing: .32em;
    margin-top: 8px; text-transform: uppercase; font-weight: 500;
  }
  .brand .rule {
    width: 36px; height: 2px; background: #4F5BD5; border-radius: 2px;
    margin: 14px auto 0;
  }

  /* 登录卡 */
  .login-card {
    width: 100%; max-width: 380px;
    background: rgba(22, 25, 34, 0.72);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    backdrop-filter: blur(24px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    padding: 32px 30px 26px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
    animation: cardIn .55s cubic-bezier(.16,1,.3,1) .08s both;
  }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; color: rgba(255,255,255,0.42); font-size: 12px;
    margin-bottom: 7px; font-weight: 500; letter-spacing: .04em; padding-left: 2px;
  }
  .form-group input {
    width: 100%; min-height: 46px; padding: 11px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 10px;
    color: rgba(255,255,255,0.92); font-size: 15px;
    outline: none; transition: border-color .2s, background .2s, box-shadow .2s;
    -webkit-appearance: none;
  }
  .form-group input:focus {
    border-color: rgba(79, 91, 213, 0.75);
    background: rgba(255,255,255,0.07);
    box-shadow: 0 0 0 3px rgba(79, 91, 213, 0.18);
  }
  .form-group input::placeholder { color: rgba(255,255,255,0.22); }

  .captcha-row { display: flex; gap: 10px; align-items: stretch; }
  .captcha-row input { flex: 1; }
  .captcha-img {
    width: 112px; min-height: 46px;
    border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.09);
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.35); font-size: 12px;
    user-select: none; overflow: hidden; flex-shrink: 0;
    transition: border-color .2s;
  }
  .captcha-img:hover { border-color: rgba(255,255,255,0.22); }
  .captcha-img img { width: 100%; height: 100%; object-fit: cover; }

  .btn-login {
    width: 100%; min-height: 48px; margin-top: 10px;
    border: none; border-radius: 10px;
    background: #4F5BD5;
    color: #fff; font-size: 15px; font-weight: 600; letter-spacing: .28em; text-indent: .28em;
    cursor: pointer; transition: background .2s, transform .15s, box-shadow .2s;
    -webkit-appearance: none;
  }
  .btn-login:hover { background: #5A68E0; box-shadow: 0 8px 24px rgba(79, 91, 213, 0.35); transform: translateY(-1px); }
  .btn-login:active { transform: scale(0.985); }

  .error-msg {
    color: #E06666; font-size: 13px; margin-top: 12px;
    text-align: center; min-height: 20px; font-weight: 500;
  }
  .footer-hint {
    color: rgba(255,255,255,0.22); font-size: 11px;
    text-align: center; margin-top: 18px; line-height: 1.7; letter-spacing: .03em;
  }

  @media (max-width: 480px) {
    .brand h1 { font-size: 20px; }
    .login-card { padding: 26px 20px 20px; border-radius: 14px; }
    .form-group input { min-height: 50px; }
    .btn-login { min-height: 50px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .brand, .login-card { animation: none; }
  }
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="bg-canvas"></canvas>

<div class="login-wrap">
  <div class="brand">
    <div class="logo"><img src="assets/logo-ddkh.png" alt="点点开黑"></div>
    <h1>兔玩大数据 · 姐妹团看板</h1>
    <div class="en">Sisters Data Console</div>
    <div class="rule"></div>
  </div>

  <div class="login-card">
    <div class="form-group">
      <label>厅运营UID</label>
      <input type="text" id="login-uid" placeholder="请输入您的 UID" autocomplete="off" inputmode="numeric">
    </div>

    <div class="form-group">
      <label>验证码</label>
      <div class="captcha-row">
        <input type="text" id="login-captcha" placeholder="输入验证码" maxlength="4" autocomplete="off" autocapitalize="characters">
        <div class="captcha-img" id="captcha-box" onclick="loadCaptcha()" title="点击刷新">
          <span>加载中...</span>
        </div>
      </div>
    </div>

    <button class="btn-login" onclick="doLogin()">登 录</button>
    <div class="error-msg" id="login-error"></div>
    <div class="footer-hint">白名单登录 · 未授权请联系管理员添加 UID</div>
    
    <div class="footer-hint">Design by LuDeng</div>
  </div>
</div>

<script>
const API_BASE = '';

// 页面加载时自动清除可能残留的 auth_uid Cookie
(function clearAuthCookie() {
  document.cookie = 'auth_uid=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
})();

// ========== 可交互粒子背景（鼠标牵引 + 邻近连线） ==========
(function initParticleBg() {
  const canvas = document.getElementById('bg-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = canvas.width = window.innerWidth * dpr;
    H = canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const COUNT = Math.min(110, Math.floor((window.innerWidth * window.innerHeight) / 12000));
  const LINK_DIST = 110;      // 粒子间连线距离
  const MOUSE_DIST = 190;     // 鼠标影响半径
  const particles = [];
  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.45,
      vy: (Math.random() - 0.5) * 0.45,
      r: Math.random() * 1.6 + 1,
    });
  }

  let mouse = { x: -9999, y: -9999 };
  document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  document.addEventListener('touchmove', e => {
    if (e.touches.length) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
  }, { passive: true });
  document.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

  function draw() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    for (const p of particles) {
      // 鼠标牵引：靠近鼠标的粒子被轻轻吸附过去
      const mdx = mouse.x - p.x, mdy = mouse.y - p.y;
      const md = Math.sqrt(mdx * mdx + mdy * mdy);
      if (md < MOUSE_DIST && md > 0) {
        const f = (1 - md / MOUSE_DIST) * 0.35;
        p.vx += (mdx / md) * f;
        p.vy += (mdy / md) * f;
      }
      p.vx *= 0.96; p.vy *= 0.96;  // 阻尼，防止越吸越快
      // 保持最低漂移速度，粒子不会停死
      if (Math.abs(p.vx) < 0.08) p.vx += (Math.random() - 0.5) * 0.05;
      if (Math.abs(p.vy) < 0.08) p.vy += (Math.random() - 0.5) * 0.05;
      p.x += p.vx; p.y += p.vy;
      if (p.x < -20) p.x = window.innerWidth + 20;
      if (p.x > window.innerWidth + 20) p.x = -20;
      if (p.y < -20) p.y = window.innerHeight + 20;
      if (p.y > window.innerHeight + 20) p.y = -20;

      const near = md < MOUSE_DIST ? (1 - md / MOUSE_DIST) : 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + near * 1.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(139, 152, 236, ${0.45 + near * 0.5})`;
      ctx.fill();
    }

    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINK_DIST) {
          // 连线越靠近鼠标越亮
          const mx = (particles[i].x + particles[j].x) / 2 - mouse.x;
          const my = (particles[i].y + particles[j].y) / 2 - mouse.y;
          const mdist = Math.sqrt(mx * mx + my * my);
          const boost = mdist < MOUSE_DIST ? (1 - mdist / MOUSE_DIST) * 0.25 : 0;
          const alpha = (1 - dist / LINK_DIST) * 0.16 + boost;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(124, 140, 235, ${Math.min(alpha, 0.5)})`;
          ctx.lineWidth = 0.7;
          ctx.stroke();
        }
      }
    }
    if (!reduced) requestAnimationFrame(draw);
  }
  draw();
})();

// ========== 验证码 ==========
async function loadCaptcha() {
  const box = document.getElementById('captcha-box');
  box.innerHTML = '<span>加载中...</span>';
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 5000);
    const res = await fetch(API_BASE + '/api/captcha?t=' + Date.now(), { signal: controller.signal });
    clearTimeout(timer);
    const data = await res.json();
    if (data.image) {
      box.innerHTML = '<img src="' + data.image + '" alt="验证码">';
    } else {
      box.innerHTML = '<span style="font-size:11px;">加载失败，点击重试</span>';
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      box.innerHTML = '<span style="font-size:11px;">请求超时，点击重试</span>';
    } else {
      box.innerHTML = '<span style="font-size:11px;">加载失败，点击重试</span>';
    }
  }
}

// ========== 登录 ==========
async function doLogin() {
  const uid = document.getElementById('login-uid').value.trim();
  const captcha = document.getElementById('login-captcha').value.trim().toUpperCase();
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';

  if (!uid) { errEl.textContent = '请输入 UID'; return; }
  if (!captcha) { errEl.textContent = '请输入验证码'; return; }

  try {
    const res = await fetch(API_BASE + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid, captcha })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = '/';
    } else {
      errEl.textContent = data.error || '登录失败';
      loadCaptcha();
    }
  } catch (e) {
    errEl.textContent = '网络错误，请检查后端服务';
  }
}

// 回车键登录
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// 页面加载时获取验证码
loadCaptcha();
</script>

</body>
</html>
