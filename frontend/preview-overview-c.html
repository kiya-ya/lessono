<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预览C · 本周时间轴</title>
<script src="js/echarts.min.js"></script>
<style>
:root { --bg:#F2F3F7; --card:#fff; --tx:#1A1D26; --t2:#5C5C66; --t3:#9CA3AF; --ac:#7C5CFF; --up:#16A34A; --down:#DC2626; --warn:#D97706; --line:#ECEEF2; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--tx); padding:18px 26px 26px; }
a { text-decoration:none; }
.top { display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
.top h1 { font-size:18px; font-weight:700; }
.top .sub { font-size:12px; color:var(--t3); }
.top .nav { margin-left:auto; font-size:12px; color:var(--ac); }

/* 顶部 slim KPI 条 */
.slim { display:flex; gap:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:16px; }
.slim .it { flex:1; padding:10px 14px; border-right:1px solid var(--line); }
.slim .it:last-child { border-right:none; }
.slim .l { font-size:10.5px; color:var(--t3); }
.slim .v { font-size:17px; font-weight:700; margin-top:1px; font-variant-numeric:tabular-nums; }
.slim .v small { font-size:10px; font-weight:400; margin-left:4px; }
.slim .up { color:var(--up); } .slim .down { color:var(--down); }

.main { display:grid; grid-template-columns:1fr 300px; gap:14px; }
.panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
.panel .h { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.panel .h b { font-size:14px; }
.panel .h .tag { font-size:10.5px; color:var(--t3); }
#week-chart { height:300px; }
.sum-it { padding:10px 0; border-bottom:1px dashed var(--line); }
.sum-it:last-child { border-bottom:none; }
.sum-it .l { font-size:11.5px; color:var(--t3); }
.sum-it .v { font-size:20px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }
.sum-it .s { font-size:11px; color:var(--t2); margin-top:2px; }

/* 底部模块导航砖 */
.tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px; }
.tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; cursor:pointer; transition:transform .15s, box-shadow .15s; position:relative; overflow:hidden; }
.tile:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(26,29,38,.1); }
.tile::after { content:''; position:absolute; right:-18px; top:-18px; width:56px; height:56px; border-radius:50%; background:var(--tile-c,#7C5CFF); opacity:.12; }
.tile .ic { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; background:var(--tile-c,#7C5CFF); }
.tile b { display:block; font-size:13.5px; margin-top:10px; }
.tile .s { font-size:11.5px; color:var(--t3); margin-top:3px; line-height:1.5; }
.tile .n { font-size:18px; font-weight:700; margin-top:8px; font-variant-numeric:tabular-nums; }
@media (max-width:900px){ .main{grid-template-columns:1fr;} .tiles{grid-template-columns:1fr 1fr;} .slim{flex-wrap:wrap;} .slim .it{min-width:33%;} }
</style>
</head>
<body>
<div class="top">
  <h1>姐妹团驾驶舱 <span style="font-size:10.5px;color:var(--t3);font-weight:400;">预览 C · 本周时间轴</span></h1>
  <span class="sub" id="ref-date">—</span>
  <a class="nav" href="/">← 返回正式版</a>
</div>

<div class="slim" id="slim"></div>

<div class="main">
  <div class="panel">
    <div class="h"><b>本周节奏 · 每日新成团 vs 解散</b><span class="tag">实线=本周 · 虚线=上周</span></div>
    <div id="week-chart"></div>
  </div>
  <div class="panel">
    <div class="h"><b>本周摘要</b></div>
    <div id="sum"></div>
  </div>
</div>

<div class="tiles">
  <div class="tile" style="--tile-c:#D56060;" onclick="location.href='/#alerts'">
    <div class="ic">警</div><b>预警中心</b><div class="s">规则预警 + 团分析体检</div><div class="n" id="tile-warn">—</div>
  </div>
  <div class="tile" style="--tile-c:#C98A2D;" onclick="location.href='/#compare'">
    <div class="ic">厅</div><b>厅分析</b><div class="s">厅排行 · 单厅下钻</div><div class="n" id="tile-hall">—</div>
  </div>
  <div class="tile" style="--tile-c:#7C5CFF;" onclick="location.href='/#captains'">
    <div class="ic">姐</div><b>姐姐分析</b><div class="s">画像 · 毕业妹妹 · 师门榜</div><div class="n" id="tile-sis">—</div>
  </div>
  <div class="tile" style="--tile-c:#0EA5A4;" onclick="location.href='/#detail'">
    <div class="ic">细</div><b>明细数据</b><div class="s">全量团搜索 · 生命周期方框</div><div class="n" id="tile-det">—</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

async function main() {
  const k = await (await fetch('/api/kpi?hall=all')).json();
  const kd = k.data;
  $('ref-date').textContent = `数据周期 ${k.week || ''} · 对比上一${k.period_type==='month'?'月':'周'}`;
  const items = [
    { l:'进行中姐妹团', v: kd.active_team.value, d: kd.active_team.change },
    { l:'新成团数', v: kd.new_team.value, d: kd.new_team.change },
    { l:'姐妹团留存率', v: Math.round(kd.retention.value)+'%', d: kd.retention.change, suf:'pp' },
    { l:'解散率', v: kd.dissolution.value.toFixed(1)+'%', d: -kd.dissolution.change, suf:'pp' },
    { l:'妹妹留存率', v: Math.round(kd.sister_retention.value)+'%', d: null },
    { l:'礼物奖励', v: kd.revenue.value >= 10000 ? (kd.revenue.value/10000).toFixed(1)+'w' : Math.round(kd.revenue.value), d: kd.revenue.change },
  ];
  $('slim').innerHTML = items.map(x => `<div class="it"><div class="l">${x.l}</div><div class="v">${x.v}${x.d!=null?`<small class="${x.d>=0?'up':'down'}">${x.d>=0?'↑':'↓'}${Math.abs(x.d)}${x.suf||'%'}</small>`:''}</div></div>`).join('');

  // 本周 vs 上周 日级
  const d = await (await fetch('/api/daily-events?days=14')).json();
  const labels = ['周日','周一','周二','周三','周四','周五','周六'];
  const dayName = s => labels[new Date(s+'T00:00:00').getDay()];
  const thisW = d.dates.slice(7), lastW = d.dates.slice(0,7);
  const x = thisW.map(dayName);
  const chart = echarts.init($('week-chart'));
  chart.setOption({
    tooltip:{trigger:'axis'},
    legend:{data:['本周新成团','上周新成团','本周解散','上周解散'],top:0,right:8,textStyle:{fontSize:11}},
    grid:{left:8,right:12,top:34,bottom:8,containLabel:true},
    xAxis:{type:'category',data:x,axisLabel:{fontSize:11,color:'#6B7280'}},
    yAxis:{type:'value',minInterval:1,axisLabel:{fontSize:10,color:'#9CA3AF'},splitLine:{lineStyle:{color:'#F0F1F4'}}},
    series:[
      {name:'本周新成团',type:'line',data:d.new_teams.slice(7),smooth:true,symbolSize:6,lineStyle:{width:3,color:'#7C5CFF'},itemStyle:{color:'#7C5CFF'},areaStyle:{color:'rgba(124,92,255,.10)'}},
      {name:'上周新成团',type:'line',data:d.new_teams.slice(0,7),smooth:true,symbol:'none',lineStyle:{width:1.5,type:'dashed',color:'#B7A8FF'},itemStyle:{color:'#B7A8FF'}},
      {name:'本周解散',type:'line',data:d.dissolved.slice(7),smooth:true,symbolSize:6,lineStyle:{width:3,color:'#D56060'},itemStyle:{color:'#D56060'},areaStyle:{color:'rgba(213,96,96,.08)'}},
      {name:'上周解散',type:'line',data:d.dissolved.slice(0,7),smooth:true,symbol:'none',lineStyle:{width:1.5,type:'dashed',color:'#F0A3A3'},itemStyle:{color:'#F0A3A3'}},
    ]
  });

  // 摘要
  const w = await (await fetch('/api/warncenter')).json();
  const trig = w.cards.filter(c=>c.triggered).length;
  const g = (await (await fetch('/api/grad-retention')).json()).stats;
  $('sum').innerHTML = `
    <div class="sum-it"><div class="l">预警触发</div><div class="v" style="color:${trig?'var(--down)':'var(--up)'}">${trig} 项</div><div class="s">${trig ? w.cards.filter(c=>c.triggered).map(c=>c.title).join('、') : '全部正常'}</div></div>
    <div class="sum-it"><div class="l">毕业妹妹 · 第1周仍在排档</div><div class="v" style="color:var(--up)">${g.w1s_rate ?? '—'}%</div><div class="s">${g.w1_scheduled}/${g.w1s_covered} 位 · 产出达标 ${g.w1_rate ?? '—'}%</div></div>
    <div class="sum-it"><div class="l">本周毕业</div><div class="v">${kd.graduated_sisters.value} 人</div><div class="s">满 30 天自动毕业</div></div>`;
  $('tile-warn').textContent = trig ? trig + ' 项触发' : '全部正常';
  $('tile-warn').style.color = trig ? 'var(--down)' : 'var(--up)';
  $('tile-sis').textContent = (g.w1s_rate ?? '—') + '% 在排档';

  // 厅 TOP1 + 明细计数
  const ho = await (await fetch('/api/hall-overview?weeks=2')).json();
  const top = ho.data.filter(h=>h.sister_weekly_revenue!=null).sort((a,b)=>b.sister_weekly_revenue-a.sister_weekly_revenue)[0];
  $('tile-hall').textContent = top ? top.hall_name.slice(0, 8) : '—';
  const dt = await (await fetch('/api/detail-table?per_page=1')).json();
  $('tile-det').textContent = dt.total + ' 团';
}
main().catch(e => { document.body.insertAdjacentHTML('afterbegin', `<div style="background:#FDECEC;color:#DC2626;padding:8px 14px;border-radius:8px;margin-bottom:10px;font-size:12px;">加载失败（请先登录正式版页面）：${e.message}</div>`); });
</script>
</body>
</html>
